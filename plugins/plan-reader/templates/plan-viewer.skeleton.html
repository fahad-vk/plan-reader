<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Plan Reader</title>

<!-- ============================================================= -->
<!-- Vendored highlight.js theme CSS (light + dark), injected by    -->
<!-- scripts/vendor-libs.js. Uses native CSS nesting to scope by    -->
<!-- theme so a single stylesheet serves both.                      -->
<!-- ============================================================= -->
<style id="hljs-theme">

<style>
/* ---- design tokens (light is the base; dark overrides) -------------
   Warm-paper + teal palette ported from the "Plan Reader" design.
   Fonts are OFFLINE system stacks: the real families (Source Serif 4,
   IBM Plex Sans/Mono) render only if the user has them installed; the
   viewer never fetches from the network. ----------------------------- */
:root {
  --paper: #fbfaf7;
  --surface: #ffffff;
  --surface-2: #f5f3ee;
  --text: #1b1a17;
  --text-muted: #5f5c55;
  --border: #e6e3dc;
  --border-2: #ddd8cf;
  --accent: #0f6e62;
  --accent-hi: #0a5049;
  --accent-soft: #e2efec;
  --on-accent: #fbfaf7;
  --focus: #0f6e62;
  --mark: #f7ecb8;
  --danger: #b23a33;
  --banner-bg: #fff4e5;
  --banner-text: #7a4a00;
  --reading-measure: 46rem;
  --rail: 18rem;
  --player-h: 0px;
  --font-read: "Source Serif 4", Georgia, "Iowan Old Style", "Times New Roman", serif;
  --font-ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "IBM Plex Mono", "SFMono-Regular", "Cascadia Code", Consolas, "Liberation Mono", monospace;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --paper: #15171a;
  --surface: #1b1e22;
  --surface-2: #23272c;
  --text: #eceae5;
  --text-muted: #a6a29a;
  --border: #2c3036;
  --border-2: #363b41;
  --accent: #5fcbbb;
  --accent-hi: #8fe0d3;
  --accent-soft: #123330;
  --on-accent: #10221f;
  --focus: #5fcbbb;
  --mark: #3a3416;
  --danger: #e8837b;
  --banner-bg: #3a2e12;
  --banner-text: #ffd591;
  color-scheme: dark;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #15171a; --surface: #1b1e22; --surface-2: #23272c;
    --text: #eceae5; --text-muted: #a6a29a; --border: #2c3036; --border-2: #363b41;
    --accent: #5fcbbb; --accent-hi: #8fe0d3; --accent-soft: #123330; --on-accent: #10221f;
    --focus: #5fcbbb; --mark: #3a3416; --danger: #e8837b;
    --banner-bg: #3a2e12; --banner-text: #ffd591;
    color-scheme: dark;
  }
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--paper);
  color: var(--text);
  font-family: var(--font-ui);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
::selection { background: var(--accent-soft); }

/* ---- accessibility helpers ---------------------------------------- */
.visually-hidden {
  position: absolute !important;
  width: 1px; height: 1px;
  padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0);
  white-space: nowrap; border: 0;
}
:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 2px;
  border-radius: 6px;
}
.skip-link {
  position: absolute; left: 0.75rem; top: -3.5rem;
  background: var(--accent); color: var(--on-accent);
  padding: 0.55rem 0.9rem; border-radius: 8px; z-index: 100;
  font-size: 0.82rem; text-decoration: none;
  transition: top 0.15s ease;
}
.skip-link:focus { top: 0.75rem; }

/* ---- reading progress bar ----------------------------------------- */
#progress-bar {
  position: fixed; top: 0; left: 0; height: 2px; width: 0%;
  background: var(--accent); z-index: 60;
  transition: width 0.09s linear;
}

/* ---- header ------------------------------------------------------- */
header.app-header {
  position: sticky; top: 0; z-index: 50;
  background: var(--paper);
  border-bottom: 1px solid var(--border);
  padding: 0.72rem 1.5rem;
  display: flex; align-items: center; gap: 0.9rem; flex-wrap: wrap;
}
.header-title { display: flex; align-items: baseline; gap: 0.7rem; min-width: 0; }
header.app-header h1 {
  font-size: 0.95rem; margin: 0; font-weight: 600;
  letter-spacing: -0.01em; white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis; max-width: 42vw;
}
#crumb {
  font-size: 0.82rem; color: var(--text-muted); white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis;
}
.header-actions { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-left: auto; align-items: center; }
.hbtn {
  font: inherit; font-size: 0.82rem; line-height: 1;
  background: var(--surface); color: var(--text);
  border: 1px solid var(--border-2); border-radius: 8px;
  padding: 0.5rem 0.75rem; cursor: pointer;
  display: inline-flex; align-items: center; gap: 0.4rem;
  transition: border-color 0.12s ease, color 0.12s ease, background 0.12s ease;
}
.hbtn:hover { border-color: var(--accent); color: var(--accent); }
.hbtn.primary {
  background: var(--accent); color: var(--on-accent); border-color: var(--accent);
}
.hbtn.primary:hover { background: var(--accent-hi); border-color: var(--accent-hi); color: var(--on-accent); }
.hbtn .kbd {
  font-family: var(--font-mono); font-size: 0.72rem; opacity: 0.75;
}

/* ---- capture-failed banner ---------------------------------------- */
#capture-banner {
  background: var(--banner-bg); color: var(--banner-text);
  border-bottom: 1px solid var(--border);
  padding: 0.7rem 1.5rem; font-size: 0.88rem; line-height: 1.5;
}
#capture-banner[hidden] { display: none; }
#capture-banner code { font-family: var(--font-mono); font-size: 0.82rem; }

/* ---- three-zone layout -------------------------------------------- */
.layout {
  display: grid;
  grid-template-columns: var(--rail) minmax(0, 1fr);
  align-items: start;
  max-width: 84rem; margin: 0 auto;
}
nav.toc {
  position: sticky; top: 3.3rem;
  align-self: start;
  height: calc(100vh - 3.3rem);
  overflow-y: auto;
  padding: 1.6rem 1.2rem 2rem 1.5rem;
  display: flex; flex-direction: column; gap: 1.15rem;
}
.toc-search { position: relative; }
.toc-search .icon {
  position: absolute; left: 0.7rem; top: 50%; transform: translateY(-50%);
  font-size: 0.8rem; color: var(--text-muted); pointer-events: none;
}
#toc-search {
  width: 100%; font: inherit; font-size: 0.82rem; color: var(--text);
  background: var(--surface); border: 1px solid var(--border-2);
  border-radius: 8px; padding: 0.55rem 0.6rem 0.55rem 1.9rem; outline: none;
}
#toc-search:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.toc-contents { display: flex; flex-direction: column; gap: 0.1rem; }
nav.toc h2 {
  font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.09em;
  color: var(--text-muted); font-weight: 600; margin: 0 0 0.55rem 0.6rem;
}
nav.toc ol { list-style: none; margin: 0; padding: 0; }
nav.toc a {
  display: flex; align-items: baseline; gap: 0.6rem;
  text-decoration: none; color: var(--text-muted);
  padding: 0.42rem 0.6rem; border-radius: 8px; font-size: 0.84rem;
  line-height: 1.4; transition: background 0.12s ease, color 0.12s ease;
}
nav.toc a .num {
  font-variant-numeric: tabular-nums; font-size: 0.72rem;
  color: var(--text-muted); width: 1.1rem; flex: none;
}
nav.toc a .label { flex: 1; min-width: 0; }
nav.toc a:hover { background: var(--surface-2); color: var(--text); }
nav.toc a[aria-current="true"] {
  color: var(--accent); background: var(--accent-soft); font-weight: 600;
}
nav.toc a[aria-current="true"] .num { color: var(--accent); }
nav.toc a.lvl-3 { padding-left: 1.4rem; font-size: 0.8rem; }
nav.toc a.lvl-4 { padding-left: 2.1rem; font-size: 0.78rem; }
#toc-empty { font-size: 0.82rem; color: var(--text-muted); padding: 0.6rem; line-height: 1.5; }
#toc-empty[hidden] { display: none; }
.toc-foot {
  margin-top: auto; border-top: 1px solid var(--border); padding-top: 1rem;
  display: flex; flex-direction: column; gap: 0.5rem;
}
.toc-foot .read {
  font-size: 0.78rem; color: var(--text-muted);
  font-variant-numeric: tabular-nums;
}
.toc-foot .cwd {
  font-size: 0.72rem; color: var(--text-muted);
  font-family: var(--font-mono); word-break: break-all; line-height: 1.5;
}

/* ---- reading column ----------------------------------------------- */
.reading-wrap { padding: 2.4rem 3rem calc(var(--player-h) + 3rem) 2.6rem; min-width: 0; }
.eyebrow {
  font-size: 0.78rem; color: var(--text-muted); letter-spacing: 0.01em;
  margin: 0 auto 1.1rem; max-width: var(--reading-measure);
}
main.plan {
  max-width: var(--reading-measure);
  margin: 0 auto;
  font-family: var(--font-read);
  font-size: 1.14rem;
}
main.plan h1 {
  font-size: 2.5rem; line-height: 1.12; margin: 0 0 1rem;
  letter-spacing: -0.022em; font-weight: 600;
}
main.plan h2 {
  font-size: 0.95rem; font-weight: 600; letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--accent);
  font-family: var(--font-ui);
  margin: 3rem 0 1rem; padding-top: 0;
}
main.plan h3 { font-size: 1.3rem; margin: 1.9rem 0 0.6rem; letter-spacing: -0.01em; }
main.plan h4 { font-size: 1.1rem; margin: 1.4rem 0 0.45rem; }
main.plan p, main.plan li { line-height: 1.7; text-wrap: pretty; }
main.plan > p:first-of-type { font-size: 1.24rem; color: var(--text-muted); line-height: 1.55; }
main.plan a { color: var(--accent); text-underline-offset: 2px; }
main.plan a:hover { color: var(--accent-hi); }
main.plan blockquote {
  margin: 1.2rem 0; padding: 0.5rem 1.1rem; border-left: 3px solid var(--accent);
  color: var(--text-muted); background: var(--surface-2); border-radius: 0 8px 8px 0;
}
main.plan code:not(.hljs) {
  font-family: var(--font-mono); font-size: 0.86em;
  background: var(--surface-2); padding: 0.12rem 0.38rem; border-radius: 5px;
}
/* Code card: a mono bar (language + copy) sits above the highlighted block. */
.code-wrap {
  margin: 1.3rem 0; border: 1px solid var(--border); border-radius: 12px;
  overflow: hidden; background: var(--surface);
}
.code-bar {
  display: flex; align-items: center; gap: 0.6rem;
  padding: 0.5rem 0.85rem; border-bottom: 1px solid var(--border);
  background: var(--surface-2);
}
.code-bar .code-lang {
  font-family: var(--font-mono); font-size: 0.72rem; color: var(--text-muted);
  letter-spacing: 0.03em;
}
.code-bar .spacer { flex: 1; }
.code-copy {
  font: inherit; font-size: 0.74rem; cursor: pointer;
  background: transparent; color: var(--text);
  border: 1px solid var(--border-2); border-radius: 6px; padding: 0.25rem 0.55rem;
}
.code-copy:hover { border-color: var(--accent); color: var(--accent); }
main.plan pre {
  border: 0; border-radius: 0; overflow: hidden;
  background: transparent; padding: 0; margin: 0;
  font-family: var(--font-mono); font-size: 0.84rem; line-height: 1.6;
}
main.plan pre code { font-family: inherit; }
/* The a11y hljs theme paints its own contrast-tuned background on the code
   element; that scrollable code element is made keyboard-focusable in JS. */
main.plan pre code.hljs { border-radius: 0; }
main.plan table {
  border-collapse: collapse; width: 100%; margin: 1.2rem 0;
  font-size: 0.92rem; font-family: var(--font-ui); display: block; overflow-x: auto;
}
main.plan th, main.plan td { border: 1px solid var(--border); padding: 0.5rem 0.75rem; text-align: left; }
main.plan th { background: var(--surface-2); font-weight: 600; }
main.plan tbody tr:nth-child(even) { background: var(--surface-2); }
main.plan hr { border: 0; border-top: 1px solid var(--border); margin: 2.4rem 0; }

/* highlight-as-read target */
.tts-active {
  background: var(--mark);
  box-shadow: 0 0 0 4px var(--mark);
  border-radius: 3px;
}

/* ---- read-aloud player (bottom, slide-up) ------------------------- */
.player {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 55;
  background: var(--surface); border-top: 1px solid var(--border);
  box-shadow: 0 -8px 28px rgba(0,0,0,0.08);
  transform: translateY(100%); visibility: hidden;
  /* Animate only the slide; flip visibility instantly so controls are
     focusable the moment the player opens (no mid-transition focus race). */
  transition: transform 0.22s cubic-bezier(0.2,0.8,0.2,1);
}
.player.open { transform: translateY(0); visibility: visible; }
.player-inner {
  max-width: 84rem; margin: 0 auto;
  display: flex; align-items: center; gap: 0.9rem;
  padding: 0.7rem 1.5rem; flex-wrap: wrap;
}
.player .group { display: flex; align-items: center; gap: 0.4rem; flex: 0 0 auto; }
.pbtn {
  font: inherit; font-size: 0.82rem; cursor: pointer; color: var(--text);
  background: var(--surface-2); border: 1px solid var(--border-2);
  border-radius: 8px; padding: 0.45rem 0.7rem; min-width: 2.4rem;
  display: inline-flex; align-items: center; justify-content: center; gap: 0.35rem;
  transition: border-color 0.12s ease, color 0.12s ease, background 0.12s ease;
}
.pbtn:hover { border-color: var(--accent); color: var(--accent); }
.pbtn.primary {
  background: var(--accent); color: var(--on-accent); border-color: var(--accent);
  min-width: 6rem; font-weight: 500;
}
.pbtn.primary:hover { background: var(--accent-hi); border-color: var(--accent-hi); color: var(--on-accent); }
.pbtn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.pbtn.danger:hover { border-color: var(--danger); color: var(--danger); }
.player .now {
  display: flex; flex-direction: column; gap: 0.4rem; flex: 1 1 13rem; min-width: 11rem;
}
#now-reading {
  font-size: 0.8rem; color: var(--text-muted);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
#seek { display: flex; gap: 0.25rem; }
#seek .seg {
  flex: 1; height: 5px; min-width: 0.5rem; border: 0; padding: 0; cursor: pointer;
  border-radius: 3px; background: var(--border);
  transition: background 0.16s ease, opacity 0.16s ease;
}
#seek .seg.done { background: var(--accent); }
#seek .seg.current { background: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
#seek .seg:focus-visible { outline-offset: 3px; }
.player label { font-size: 0.76rem; color: var(--text-muted); }
.player select { font: inherit; font-size: 0.8rem; }
.player select {
  background: var(--surface-2); color: var(--text);
  border: 1px solid var(--border-2); border-radius: 7px;
  padding: 0.35rem 0.45rem; max-width: 11rem;
}
.player select:focus { border-color: var(--accent); }

/* ---- command palette ---------------------------------------------- */
#palette-overlay {
  position: fixed; inset: 0; z-index: 90;
  background: rgba(20,19,17,0.34);
  display: flex; align-items: flex-start; justify-content: center;
  padding-top: 13vh;
}
#palette-overlay[hidden] { display: none; }
#palette {
  width: min(35rem, 92vw);
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 14px; box-shadow: 0 24px 60px rgba(0,0,0,0.28);
  overflow: hidden;
}
#palette-input {
  width: 100%; font: inherit; font-size: 0.98rem;
  padding: 0.95rem 1.05rem; border: 0; border-bottom: 1px solid var(--border);
  background: transparent; color: var(--text); outline: none;
}
#palette-list { list-style: none; margin: 0; padding: 0.4rem; max-height: 46vh; overflow-y: auto; }
#palette-list li {
  padding: 0.6rem 0.75rem; border-radius: 9px; cursor: pointer;
  display: flex; align-items: center; gap: 0.6rem; font-size: 0.92rem;
}
#palette-list li[aria-selected="true"] { background: var(--accent-soft); }
#palette-list .pl-kind {
  font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase;
  letter-spacing: 0.05em; margin-left: auto;
}

@media (prefers-reduced-motion: reduce) {
  * { scroll-behavior: auto !important; transition: none !important; }
  .player { transition: none !important; }
}

@media (max-width: 820px) {
  .layout { grid-template-columns: 1fr; }
  nav.toc { display: none; }
  .reading-wrap { padding: 1.6rem 1.2rem calc(var(--player-h) + 2.5rem); }
  header.app-header h1 { max-width: 55vw; }
  #crumb { display: none; }
  main.plan h1 { font-size: 2rem; }
}
</style>
</head>
<body>
<a class="skip-link" href="#plan-main">Skip to plan content</a>
<div id="progress-bar" role="presentation"></div>

<!-- polite live region for playback + section announcements -->
<div id="live" class="visually-hidden" aria-live="polite" aria-atomic="true"></div>

<header class="app-header">
  <div class="header-title">
    <h1 id="plan-title">Plan Reader</h1>
    <span id="crumb"></span>
  </div>
  <div class="header-actions">
    <button class="hbtn primary" id="btn-listen">▶ Listen</button>
    <button class="hbtn" id="btn-copy">Copy plan</button>
    <button class="hbtn" id="palette-open" aria-haspopup="dialog">Actions <span class="kbd">⌘K</span></button>
    <button class="hbtn" id="theme-toggle" aria-pressed="false" aria-label="Switch colour theme">Theme</button>
  </div>
</header>

<div id="capture-banner" role="alert" hidden>
  <strong>Showing the last good plan.</strong>
  The most recent capture failed — re-run your plan and try <code>/read</code> again.
</div>

<div class="layout">
  <nav class="toc" aria-label="Table of contents">
    <div class="toc-search">
      <span class="icon" aria-hidden="true">⌕</span>
      <input id="toc-search" type="text" placeholder="Search this plan  /"
             aria-label="Search this plan" autocomplete="off" />
    </div>
    <div class="toc-contents">
      <h2 id="toc-heading">Contents</h2>
      <ol id="toc-list" aria-labelledby="toc-heading"></ol>
      <div id="toc-empty" hidden></div>
    </div>
    <div class="toc-foot">
      <div class="read" id="meta-read">~ min read</div>
      <div class="cwd" id="meta-cwd">—</div>
    </div>
  </nav>

  <div class="reading-wrap">
    <div class="eyebrow" id="eyebrow"></div>
    <main class="plan" id="plan-main" tabindex="-1" aria-label="Plan content"></main>
  </div>
</div>

<div class="player" id="player" role="region" aria-label="Read-aloud player">
  <div class="player-inner">
    <div class="group">
      <button class="pbtn" id="btn-prev" aria-label="Previous section">⏮</button>
      <button class="pbtn primary" id="btn-play" aria-label="Play read-aloud">▶ Play</button>
      <button class="pbtn" id="btn-next" aria-label="Next section">⏭</button>
    </div>
    <div class="now">
      <div id="now-reading">Ready to read</div>
      <div id="seek" role="group" aria-label="Jump to section"></div>
    </div>
    <div class="group">
      <label for="voice">Voice</label>
      <select id="voice" aria-label="Voice"></select>
    </div>
    <div class="group">
      <label for="rate">Speed</label>
      <select id="rate" aria-label="Reading speed">
        <option value="0.75">0.75×</option>
        <option value="1" selected>1×</option>
        <option value="1.25">1.25×</option>
        <option value="1.5">1.5×</option>
        <option value="1.75">1.75×</option>
        <option value="2">2×</option>
      </select>
    </div>
    <div class="group">
      <button class="pbtn" id="btn-readcode" aria-pressed="false"
              aria-label="Read code blocks aloud">Skip code</button>
    </div>
    <div class="group">
      <button class="pbtn danger" id="btn-stop" aria-label="Stop read-aloud" disabled>Stop</button>
    </div>
  </div>
</div>

<!-- command palette -->
<div id="palette-overlay" hidden>
  <div id="palette" role="dialog" aria-modal="true" aria-label="Command palette">
    <input id="palette-input" type="text" placeholder="Jump to a section, play, switch theme…"
           aria-label="Command palette search" autocomplete="off" role="combobox"
           aria-expanded="true" aria-controls="palette-list" aria-activedescendant="" />
    <ul id="palette-list" role="listbox" aria-label="Actions"></ul>
  </div>
</div>

<script>
"use strict";
(function () {
  // -----------------------------------------------------------------
  // Injected content. open-viewer.js replaces the __…__ tokens. When
  // unreplaced (template opened directly), we fall back to the dev
  // default so the viewer renders standalone during development.
  // -----------------------------------------------------------------
  var INJECTED_PLAN_B64 = "__PLAN_BASE64__";
  var INJECTED_CWD      = "__CWD_LABEL__";
  var INJECTED_TS       = "__CAPTURED_TS__";
  var INJECTED_OK       = "__CAPTURE_OK__";
  var DEV_DEFAULT_B64   = "__DEV_DEFAULT_BASE64__";

  var isUnreplaced = function (s, token) { return s.indexOf(token) === 0; };

  var planB64 = isUnreplaced(INJECTED_PLAN_B64, "__PLAN_BASE64") ? DEV_DEFAULT_B64 : INJECTED_PLAN_B64;
  var cwd     = isUnreplaced(INJECTED_CWD, "__CWD_LABEL") ? "(dev) big-plan.md" : INJECTED_CWD;
  var ts      = isUnreplaced(INJECTED_TS, "__CAPTURED_TS") ? "dev build" : INJECTED_TS;

  var tocEmpty = document.getElementById("toc-empty");

  visibleHeadings.forEach(function (h, i) {
    var level = parseInt(h.tagName.substring(1), 10);
    var li = document.createElement("li");
    var a = document.createElement("a");
    a.href = "#" + h.id;
    a.className = "lvl-" + level;
    a.dataset.target = h.id;
    var num = document.createElement("span");
    num.className = "num";
    num.textContent = String(i + 1).padStart(2, "0");
    var label = document.createElement("span");
    label.className = "label";
    label.textContent = h.textContent;
    a.appendChild(num);
    a.appendChild(label);
    a.addEventListener("click", function (ev) {

    var q = tocSearch.value.trim().toLowerCase();

    tocLinks.forEach(function (a) {
      var match = !q || a.textContent.toLowerCase().indexOf(q) !== -1;
      a.parentNode.hidden = !match;
      if (match) anyShown = true;
    });

      tocEmpty.hidden = false;
    } else {
      tocEmpty.hidden = true;
    }
  });

  function jumpToHeading(id, focus) {
    var el = document.getElementById(id);

  }

  // ---- scroll-spy via IntersectionObserver ------------------------

  var headingText = {};

  }
  function openPalette() {
    lastFocused = document.activeElement;
    overlay.hidden = false;
    paletteInput.value = "";
    filterPalette();
    paletteInput.focus();
  }
  function closePalette() {
    overlay.hidden = true;
    if (lastFocused && lastFocused.focus) lastFocused.focus();
  }
  paletteOpenBtn.addEventListener("click", openPalette);
  paletteInput.addEventListener("input", filterPalette);
  overlay.addEventListener("mousedown", function (e) { if (e.target === overlay) closePalette(); });

  paletteInput.addEventListener("keydown", function (e) {
    if (e.key === "ArrowDown") { e.preventDefault(); paletteSelected = Math.min(filtered.length - 1, paletteSelected + 1); renderPalette(); ensureVisible(); }
    else if (e.key === "ArrowUp") { e.preventDefault(); paletteSelected = Math.max(0, paletteSelected - 1); renderPalette(); ensureVisible(); }
    else if (e.key === "Enter") { e.preventDefault(); runAction(paletteSelected, e.shiftKey); }
    else if (e.key === "Escape") { e.preventDefault(); closePalette(); }
    else if (e.key === "Tab") { e.preventDefault(); } // focus trap: keep focus on input
  });
  function ensureVisible() {
    var el = document.getElementById("pl-opt-" + paletteSelected);
    if (el) el.scrollIntoView({ block: "nearest" });
  }

  // =================================================================
  // Global keyboard shortcuts
  // =================================================================
  document.addEventListener("keydown", function (e) {
    var inField = /^(input|select|textarea)$/i.test((e.target.tagName || ""));
    if ((e.metaKey || e.ctrlKey) && (e.key === "k" || e.key === "K")) {
      e.preventDefault();
      if (overlay.hidden) openPalette(); else closePalette();
      return;
    }
    if (!overlay.hidden) return; // palette handles its own keys
    if (e.key === "/" && !inField) { e.preventDefault(); tocSearch.focus(); return; }
    if (inField) return;
    if (e.key === " " || e.key === "k") { e.preventDefault(); togglePlay(); }
    else if (e.key === "Escape") { stop(); }
  });

  // expose a tiny hook for automated a11y tests
  window.__planReader = {
    headingCount: headings.length,
    tocCount: tocLinks.length,
    transcriptLength: transcript.length,
    sectionCount: sections.length,
    ttsSupported: ttsSupported,
    codeUnits: transcript.filter(function (u) { return u.kind === "code"; }).length,
    firstCodeUtterance: (transcript.find(function (u) { return u.kind === "code"; }) || {}).text || null,
    openPalette: openPalette,
    closePalette: closePalette,
    isPaletteOpen: function () { return !overlay.hidden; },
    showPlayer: showPlayer,
    hidePlayer: hidePlayer,
    isPlayerOpen: function () { return player.classList.contains("open"); },
    play: play,
    pause: pause,
    stop: stop
  };
})();
</script>
