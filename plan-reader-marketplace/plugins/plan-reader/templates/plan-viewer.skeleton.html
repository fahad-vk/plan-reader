<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Plan Reader</title>

<!-- ============================================================= -->
<!-- Vendored highlight.js theme CSS (light + dark), injected by    -->
<!-- scripts/vendor-libs.js. Uses native CSS nesting to scope by    -->
<!-- theme so a single stylesheet serves both.                      -->
<!-- ============================================================= -->
<style id="hljs-theme">
/*__HLJS_CSS__*/
</style>

<style>
/* ---- design tokens (light is the base; dark overrides) ------------- */
:root {
  --bg: #fbfbfa;
  --surface: #ffffff;
  --surface-2: #f2f1ee;
  --text: #1c1b19;
  --text-muted: #55524c;
  --border: #e3e1dc;
  --accent: #7a4de8;
  --accent-contrast: #ffffff;
  --focus: #7a4de8;
  --active-bg: #efe9ff;
  --active-border: #7a4de8;
  --banner-bg: #fff4e5;
  --banner-text: #7a4a00;
  --reading-measure: 70ch;
  --rail: 17rem;
  --player-h: 4.5rem;
  --font-ui: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-read: Georgia, "Iowan Old Style", "Times New Roman", serif;
  --font-mono: "SFMono-Regular", "Cascadia Code", Consolas, "Liberation Mono", monospace;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #16151a;
  --surface: #1e1d24;
  --surface-2: #26242e;
  --text: #eceaf2;
  --text-muted: #a7a3b3;
  --border: #34313d;
  --accent: #b79cff;
  --accent-contrast: #16151a;
  --focus: #b79cff;
  --active-bg: #2c2640;
  --active-border: #b79cff;
  --banner-bg: #3a2e12;
  --banner-text: #ffd591;
  color-scheme: dark;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #16151a; --surface: #1e1d24; --surface-2: #26242e;
    --text: #eceaf2; --text-muted: #a7a3b3; --border: #34313d;
    --accent: #b79cff; --accent-contrast: #16151a; --focus: #b79cff;
    --active-bg: #2c2640; --active-border: #b79cff;
    --banner-bg: #3a2e12; --banner-text: #ffd591;
    color-scheme: dark;
  }
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-ui);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

/* ---- accessibility helpers ---------------------------------------- */
.visually-hidden {
  position: absolute !important;
  width: 1px; height: 1px;
  padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0);
  white-space: nowrap; border: 0;
}
:focus-visible {
  outline: 3px solid var(--focus);
  outline-offset: 2px;
  border-radius: 4px;
}
.skip-link {
  position: absolute; left: 0.5rem; top: -3rem;
  background: var(--accent); color: var(--accent-contrast);
  padding: 0.5rem 0.85rem; border-radius: 6px; z-index: 100;
  transition: top 0.15s ease;
}
.skip-link:focus { top: 0.5rem; }

/* ---- reading progress bar (P2) ------------------------------------ */
#progress-bar {
  position: fixed; top: 0; left: 0; height: 3px; width: 0%;
  background: var(--accent); z-index: 50;
  transition: width 0.1s linear;
}

/* ---- header ------------------------------------------------------- */
header.app-header {
  position: sticky; top: 0; z-index: 40;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0.7rem 1.1rem;
  display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap;
}
header.app-header h1 {
  font-size: 1.05rem; margin: 0; font-weight: 650;
  letter-spacing: -0.01em;
}
.header-meta { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-left: auto; align-items: center; }
.chip {
  font-size: 0.78rem; color: var(--text-muted);
  background: var(--surface-2); border: 1px solid var(--border);
  padding: 0.2rem 0.55rem; border-radius: 999px; white-space: nowrap;
}
.chip.mono { font-family: var(--font-mono); }
.hbtn {
  font: inherit; font-size: 0.82rem;
  background: var(--surface-2); color: var(--text);
  border: 1px solid var(--border); border-radius: 8px;
  padding: 0.35rem 0.6rem; cursor: pointer;
}
.hbtn:hover { border-color: var(--accent); }

/* ---- capture-failed banner (P2) ----------------------------------- */
#capture-banner {
  background: var(--banner-bg); color: var(--banner-text);
  border-bottom: 1px solid var(--border);
  padding: 0.6rem 1.1rem; font-size: 0.9rem;
}
#capture-banner[hidden] { display: none; }

/* ---- three-zone layout -------------------------------------------- */
.layout {
  display: grid;
  grid-template-columns: var(--rail) minmax(0, 1fr);
  align-items: start;
}
nav.toc {
  position: sticky; top: 3.4rem;
  align-self: start;
  height: calc(100vh - 3.4rem - var(--player-h));
  overflow-y: auto;
  padding: 1rem 0.6rem 1rem 1rem;
  border-right: 1px solid var(--border);
}
nav.toc h2 {
  font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em;
  color: var(--text-muted); margin: 0 0 0.6rem 0.4rem;
}
nav.toc ol { list-style: none; margin: 0; padding: 0; }
nav.toc a {
  display: block; text-decoration: none; color: var(--text-muted);
  padding: 0.28rem 0.5rem; border-radius: 6px; font-size: 0.87rem;
  border-left: 2px solid transparent; line-height: 1.35;
}
nav.toc a:hover { background: var(--surface-2); color: var(--text); }
nav.toc a[aria-current="true"] {
  color: var(--text); background: var(--active-bg);
  border-left-color: var(--active-border); font-weight: 600;
}
nav.toc a.lvl-3 { padding-left: 1.3rem; font-size: 0.82rem; }
nav.toc a.lvl-4 { padding-left: 2rem; font-size: 0.8rem; }

.reading-wrap { padding: 1.5rem 2rem calc(var(--player-h) + 2rem); min-width: 0; }
main.plan {
  max-width: var(--reading-measure);
  margin: 0 auto;
  font-family: var(--font-read);
  font-size: 1.06rem;
}
main.plan h1 { font-size: 1.9rem; line-height: 1.2; margin: 0 0 1rem; letter-spacing: -0.02em; }
main.plan h2 { font-size: 1.4rem; margin: 2rem 0 0.75rem; padding-top: 0.5rem; border-top: 1px solid var(--border); }
main.plan h3 { font-size: 1.15rem; margin: 1.5rem 0 0.5rem; }
main.plan h4 { font-size: 1.02rem; margin: 1.2rem 0 0.4rem; }
main.plan p, main.plan li { line-height: 1.7; }
main.plan a { color: var(--accent); }
main.plan blockquote {
  margin: 1rem 0; padding: 0.4rem 1rem; border-left: 3px solid var(--accent);
  color: var(--text-muted); background: var(--surface-2); border-radius: 0 6px 6px 0;
}
main.plan code:not(.hljs) {
  font-family: var(--font-mono); font-size: 0.88em;
  background: var(--surface-2); padding: 0.1rem 0.35rem; border-radius: 4px;
}
main.plan pre {
  border: 1px solid var(--border); border-radius: 8px; overflow: hidden;
  background: transparent; padding: 0;
  font-family: var(--font-mono); font-size: 0.86rem; line-height: 1.5;
}
main.plan pre code { font-family: inherit; }
/* Let the a11y hljs theme paint its own contrast-tuned background (#fefefe /
   #2b2b2b) on the code element; that scrollable code element is made
   keyboard-focusable in JS (axe: scrollable-region-focusable). */
main.plan pre code.hljs { border-radius: 8px; }
main.plan table {
  border-collapse: collapse; width: 100%; margin: 1rem 0;
  font-size: 0.92rem; display: block; overflow-x: auto;
}
main.plan th, main.plan td { border: 1px solid var(--border); padding: 0.45rem 0.7rem; text-align: left; }
main.plan th { background: var(--surface-2); font-weight: 650; }
main.plan tbody tr:nth-child(even) { background: var(--surface-2); }

/* highlight-as-read target */
.tts-active {
  background: var(--active-bg);
  box-shadow: 0 0 0 3px var(--active-bg);
  border-radius: 3px;
}

/* ---- player bar (bottom) ------------------------------------------ */
.player {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 45;
  min-height: 4.5rem;
  background: var(--surface); border-top: 1px solid var(--border);
  display: flex; align-items: center; align-content: center; gap: 0.6rem;
  padding: 0.5rem 1.1rem;
  /* Wrap onto extra rows at narrow / split-screen widths so every control
     stays fully visible instead of clipping the skip-code toggle off-screen.
     JS keeps --player-h in sync with the actual (possibly wrapped) height so
     the reading column's bottom padding always clears the bar. */
  flex-wrap: wrap;
}
.player .group { display: flex; align-items: center; gap: 0.35rem; flex: 0 0 auto; }
.player .spacer { flex: 1; }
.pbtn {
  font: inherit; cursor: pointer; color: var(--text);
  background: var(--surface-2); border: 1px solid var(--border);
  border-radius: 8px; padding: 0.4rem 0.7rem; min-width: 2.5rem;
  display: inline-flex; align-items: center; justify-content: center; gap: 0.3rem;
}
.pbtn:hover { border-color: var(--accent); }
.pbtn.primary { background: var(--accent); color: var(--accent-contrast); border-color: var(--accent); }
.pbtn[aria-pressed="true"] { background: var(--active-bg); border-color: var(--active-border); }
.player label { font-size: 0.8rem; color: var(--text-muted); }
.player select, .player input[type="range"] { font: inherit; }
.player select {
  background: var(--surface-2); color: var(--text);
  border: 1px solid var(--border); border-radius: 8px; padding: 0.3rem 0.4rem; max-width: 12rem;
}
#scrubber-wrap { display: flex; align-items: center; gap: 0.4rem; min-width: 8rem; flex: 1; max-width: 24rem; }
#scrubber { width: 100%; }
#scrubber-label { font-size: 0.78rem; color: var(--text-muted); white-space: nowrap; font-variant-numeric: tabular-nums; }

/* ---- command palette (P3) ----------------------------------------- */
#palette-overlay {
  position: fixed; inset: 0; z-index: 90;
  background: rgba(0,0,0,0.4);
  display: flex; align-items: flex-start; justify-content: center;
  padding-top: 12vh;
}
#palette-overlay[hidden] { display: none; }
#palette {
  width: min(38rem, 92vw);
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,0.35);
  overflow: hidden;
}
#palette-input {
  width: 100%; font: inherit; font-size: 1rem;
  padding: 0.9rem 1rem; border: 0; border-bottom: 1px solid var(--border);
  background: transparent; color: var(--text); outline: none;
}
#palette-list { list-style: none; margin: 0; padding: 0.35rem; max-height: 50vh; overflow-y: auto; }
#palette-list li {
  padding: 0.55rem 0.7rem; border-radius: 8px; cursor: pointer;
  display: flex; align-items: center; gap: 0.6rem; font-size: 0.92rem;
}
#palette-list li[aria-selected="true"] { background: var(--active-bg); }
#palette-list .pl-kind {
  font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase;
  letter-spacing: 0.05em; margin-left: auto;
}

@media (prefers-reduced-motion: reduce) {
  * { scroll-behavior: auto !important; transition: none !important; }
}

@media (max-width: 820px) {
  .layout { grid-template-columns: 1fr; }
  nav.toc { display: none; }
  .reading-wrap { padding: 1.25rem 1.1rem calc(var(--player-h) + 2rem); }
}
</style>
</head>
<body>
<a class="skip-link" href="#plan-main">Skip to plan content</a>
<div id="progress-bar" role="presentation"></div>

<!-- polite live region for playback + section announcements (R1) -->
<div id="live" class="visually-hidden" aria-live="polite" aria-atomic="true"></div>

<header class="app-header">
  <h1>Plan Reader</h1>
  <div class="header-meta">
    <span class="chip" id="readtime-chip">~ min read</span>
    <span class="chip" id="ts-chip">captured —</span>
    <span class="chip mono" id="cwd-chip">—</span>
    <button class="hbtn" id="palette-open" aria-haspopup="dialog">⌘K Actions</button>
    <button class="hbtn" id="theme-toggle" aria-pressed="false">Theme</button>
  </div>
</header>

<div id="capture-banner" role="alert" hidden>
  ⚠ The most recent plan capture failed — showing the last good plan (or the dev sample). Re-run your plan and try <code>/readplan</code> again.
</div>

<div class="layout">
  <nav class="toc" aria-label="Table of contents">
    <h2 id="toc-heading">On this page</h2>
    <ol id="toc-list" aria-labelledby="toc-heading"></ol>
  </nav>

  <div class="reading-wrap">
    <main class="plan" id="plan-main" tabindex="-1" aria-label="Plan content"></main>
  </div>
</div>

<div class="player" role="region" aria-label="Read-aloud player">
  <div class="group">
    <button class="pbtn primary" id="btn-play" aria-label="Play read-aloud">▶ Play</button>
    <button class="pbtn" id="btn-pause" aria-label="Pause read-aloud" disabled>⏸</button>
    <button class="pbtn" id="btn-stop" aria-label="Stop read-aloud" disabled>⏹</button>
  </div>
  <div id="scrubber-wrap">
    <input type="range" id="scrubber" min="0" max="0" value="0" step="1"
           aria-label="Reading position" />
    <span id="scrubber-label">0 / 0</span>
  </div>
  <div class="group">
    <label for="rate">Speed</label>
    <select id="rate" aria-label="Reading speed">
      <option value="0.75">0.75×</option>
      <option value="1" selected>1×</option>
      <option value="1.25">1.25×</option>
      <option value="1.5">1.5×</option>
      <option value="1.75">1.75×</option>
      <option value="2">2×</option>
    </select>
  </div>
  <div class="group">
    <label for="voice">Voice</label>
    <select id="voice" aria-label="Voice"></select>
  </div>
  <div class="group">
    <button class="pbtn" id="btn-readcode" aria-pressed="false"
            aria-label="Read code blocks aloud">Skip code</button>
  </div>
</div>

<!-- command palette (P3) -->
<div id="palette-overlay" hidden>
  <div id="palette" role="dialog" aria-modal="true" aria-label="Command palette">
    <input id="palette-input" type="text" placeholder="Jump to section, toggle theme, play…"
           aria-label="Command palette search" autocomplete="off" role="combobox"
           aria-expanded="true" aria-controls="palette-list" aria-activedescendant="" />
    <ul id="palette-list" role="listbox" aria-label="Actions"></ul>
  </div>
</div>

<script>/*__MARKED_MIN_JS__*/</script>
<script>/*__HLJS_MIN_JS__*/</script>

<script>
"use strict";
(function () {
  // -----------------------------------------------------------------
  // Injected content. open-viewer.js replaces the __…__ tokens. When
  // unreplaced (template opened directly), we fall back to the dev
  // default so the viewer renders standalone during development.
  // -----------------------------------------------------------------
  var INJECTED_PLAN_B64 = "__PLAN_BASE64__";
  var INJECTED_CWD      = "__CWD_LABEL__";
  var INJECTED_TS       = "__CAPTURED_TS__";
  var INJECTED_OK       = "__CAPTURE_OK__";
  var DEV_DEFAULT_B64   = "__DEV_DEFAULT_BASE64__";

  var isUnreplaced = function (s, token) { return s.indexOf(token) === 0; };

  var planB64 = isUnreplaced(INJECTED_PLAN_B64, "__PLAN_BASE64") ? DEV_DEFAULT_B64 : INJECTED_PLAN_B64;
  var cwd     = isUnreplaced(INJECTED_CWD, "__CWD_LABEL") ? "(dev) big-plan.md" : INJECTED_CWD;
  var ts      = isUnreplaced(INJECTED_TS, "__CAPTURED_TS") ? "dev build" : INJECTED_TS;
  // open-viewer.js replaces "__CAPTURE_OK__" with the bare literal true/false.
  // Unreplaced (dev) or any non-false value defaults to true.
  var captureOk = (INJECTED_OK === false || INJECTED_OK === "false") ? false : true;

  // ---- base64 (UTF-8 safe) ----------------------------------------
  function b64ToUtf8(b64) {
    var bin = atob(b64);
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder("utf-8").decode(bytes);
  }

  var rawMarkdown = "";
  try { rawMarkdown = b64ToUtf8(planB64); }
  catch (e) { rawMarkdown = "# Could not decode plan\n\nThe captured plan could not be decoded."; }

  // Strip the capture header comment (<!-- plan-reader capture ... -->)
  // that capture-plan.js prepends, so it does not render as content.
  rawMarkdown = rawMarkdown.replace(/^<!--\s*plan-reader capture[\s\S]*?-->\s*/, "");

  // ---- meta chips --------------------------------------------------
  document.getElementById("cwd-chip").textContent = cwd;
  document.getElementById("ts-chip").textContent = "captured " + ts;
  if (!captureOk) document.getElementById("capture-banner").hidden = false;

  // ---- render markdown --------------------------------------------
  var main = document.getElementById("plan-main");
  marked.setOptions({ gfm: true, breaks: false });
  main.innerHTML = marked.parse(rawMarkdown);

  // syntax highlight code blocks
  main.querySelectorAll("pre code").forEach(function (block) {
    try { hljs.highlightElement(block); } catch (e) { /* ignore */ }
  });

  // Scrollable regions (code blocks, wide tables) must be keyboard-scrollable.
  // Give them a tabindex and an accessible name so keyboard and AT users can
  // reach and scroll them (axe: scrollable-region-focusable).
  main.querySelectorAll("pre").forEach(function (pre) {
    var scroller = pre.querySelector("code") || pre; // hljs makes <code> the scroll region
    scroller.setAttribute("tabindex", "0");
    scroller.setAttribute("role", "group");
    scroller.setAttribute("aria-label", "Code block");
  });
  main.querySelectorAll("table").forEach(function (el) {
    el.setAttribute("tabindex", "0");
  });

  // read-time chip (P2): ~200 wpm
  var words = (main.textContent.match(/\S+/g) || []).length;
  var minutes = Math.max(1, Math.round(words / 200));
  document.getElementById("readtime-chip").textContent = "~" + minutes + " min read";

  // ---- slugify + heading ids --------------------------------------
  var usedIds = {};
  function slugify(text) {
    var base = text.toLowerCase().trim()
      .replace(/[^\w\s-]/g, "").replace(/\s+/g, "-").replace(/-+/g, "-") || "section";
    var id = base, n = 2;
    while (usedIds[id]) { id = base + "-" + n; n++; }
    usedIds[id] = true;
    return id;
  }

  var headings = Array.prototype.slice.call(main.querySelectorAll("h1, h2, h3, h4"));
  headings.forEach(function (h) { if (!h.id) h.id = slugify(h.textContent); });

  // ---- build the TOC (P1) -----------------------------------------
  var tocList = document.getElementById("toc-list");
  headings.forEach(function (h) {
    var level = parseInt(h.tagName.substring(1), 10);
    if (level > 4) return;
    var li = document.createElement("li");
    var a = document.createElement("a");
    a.href = "#" + h.id;
    a.textContent = h.textContent;
    a.className = "lvl-" + level;
    a.dataset.target = h.id;
    a.addEventListener("click", function (ev) {
      ev.preventDefault();
      jumpToHeading(h.id, true);
    });
    li.appendChild(a);
    tocList.appendChild(li);
  });
  var tocLinks = Array.prototype.slice.call(tocList.querySelectorAll("a"));

  function jumpToHeading(id, focus) {
    var el = document.getElementById(id);
    if (!el) return;
    el.scrollIntoView({ behavior: "smooth", block: "start" });
    if (focus) { el.setAttribute("tabindex", "-1"); el.focus({ preventScroll: true }); }
  }

  // ---- scroll-spy via IntersectionObserver (P1) -------------------
  var currentHeadingId = headings.length ? headings[0].id : null;
  function setCurrent(id) {
    currentHeadingId = id;
    tocLinks.forEach(function (a) {
      a.setAttribute("aria-current", a.dataset.target === id ? "true" : "false");
    });
  }
  if ("IntersectionObserver" in window && headings.length) {
    var spy = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (e.isIntersecting) setCurrent(e.target.id);
      });
    }, { rootMargin: "0px 0px -70% 0px", threshold: 0 });
    headings.forEach(function (h) { spy.observe(h); });
  }
  setCurrent(currentHeadingId);

  // ---- reading progress bar (P2) ----------------------------------
  var progressBar = document.getElementById("progress-bar");
  function updateProgress() {
    var doc = document.documentElement;
    var max = doc.scrollHeight - doc.clientHeight;
    var pct = max > 0 ? (doc.scrollTop / max) * 100 : 0;
    progressBar.style.width = Math.min(100, Math.max(0, pct)) + "%";
  }
  window.addEventListener("scroll", updateProgress, { passive: true });
  updateProgress();

  // Keep the reading column's bottom padding + TOC height in sync with the
  // player bar's real height, which grows when the controls wrap onto extra
  // rows at narrow widths. No feedback loop: --player-h drives content padding
  // and TOC height only, never the player's own (literal min-height) size.
  var playerEl = document.querySelector(".player");
  function syncPlayerHeight() {
    document.documentElement.style.setProperty("--player-h", playerEl.offsetHeight + "px");
  }
  syncPlayerHeight();
  // ResizeObserver catches every height change — viewport resize, font load, and
  // late voice-picker population that widens the bar into a wrapped state.
  if ("ResizeObserver" in window) {
    new ResizeObserver(syncPlayerHeight).observe(playerEl);
  } else {
    window.addEventListener("resize", syncPlayerHeight);
  }

  // =================================================================
  // R2 — build the speakable transcript, decoupled from visual DOM.
  // We walk block elements in document order and produce an ordered
  // list of utterances, each linked to a DOM node to highlight.
  // =================================================================
  function endsSentence(text) { return /[.!?]["')\]]?\s*$/.test(text); }

  // Split raw text into sentence-ish segments, PRESERVING whitespace so the
  // rendered DOM keeps its original spacing. Spoken text is trimmed later.
  function rawSentenceSegments(text) {
    if (typeof Intl !== "undefined" && Intl.Segmenter) {
      try {
        var seg = new Intl.Segmenter("en", { granularity: "sentence" });
        var out = [];
        for (var s of seg.segment(text)) out.push(s.segment);
        return out.length ? out : [text];
      } catch (e) { /* fall through */ }
    }
    return text.match(/[^.!?]+[.!?]*\s*/g) || [text];
  }

  // Wrap each sentence of an inline-bearing block in a <span> so it can be
  // highlighted as it is read, while preserving inline formatting (links read
  // as their text, inline code read plainly) and the original whitespace.
  function wrapSentences(blockEl, units) {
    var children = Array.prototype.slice.call(blockEl.childNodes);
    blockEl.textContent = "";
    var currentSpan = null, buffer = "";

    function newSpan() {
      currentSpan = document.createElement("span");
      currentSpan.className = "tts-sentence";
      blockEl.appendChild(currentSpan);
      buffer = "";
    }
    function flushUnit() {
      if (currentSpan && buffer.trim()) {
        units.push({ text: buffer.trim(), el: currentSpan, kind: "prose" });
      }
    }
    newSpan();

    children.forEach(function (node) {
      if (node.nodeType === Node.TEXT_NODE) {
        rawSentenceSegments(node.textContent).forEach(function (seg) {
          currentSpan.appendChild(document.createTextNode(seg));
          buffer += seg;
          if (endsSentence(seg)) { flushUnit(); newSpan(); }
        });
      } else {
        // inline element (a, code, strong, em…) — keep it atomic in the
        // current sentence; its spoken text is its textContent. Surrounding
        // text nodes already carry the needed spaces.
        currentSpan.appendChild(node);
        buffer += node.textContent;
      }
    });
    flushUnit();
    // remove a trailing empty span if the block ended on a sentence boundary
    if (currentSpan && !currentSpan.textContent.trim()) blockEl.removeChild(currentSpan);
  }

  var transcript = []; // { text, el, kind }

  function levelWord(n) {
    return ["", "Title", "Section", "Subsection", "Sub-subsection"][n] || "Section";
  }

  // Walk only the direct block children of <main> in order.
  Array.prototype.slice.call(main.children).forEach(function (el) {
    var tag = el.tagName.toLowerCase();
    if (/^h[1-6]$/.test(tag)) {
      var lvl = parseInt(tag.substring(1), 10);
      transcript.push({
        text: levelWord(lvl) + ": " + el.textContent.trim(),
        el: el, kind: "heading", headingId: el.id
      });
    } else if (tag === "p") {
      wrapSentences(el, transcript);
    } else if (tag === "ul" || tag === "ol") {
      Array.prototype.slice.call(el.children).forEach(function (li) {
        if (li.tagName && li.tagName.toLowerCase() === "li") wrapSentences(li, transcript);
      });
    } else if (tag === "blockquote") {
      Array.prototype.slice.call(el.querySelectorAll("p")).forEach(function (p) {
        wrapSentences(p, transcript);
      });
    } else if (tag === "pre") {
      var codeEl = el.querySelector("code") || el;
      var lines = codeEl.textContent.replace(/\n$/, "").split("\n").length;
      transcript.push({
        text: "Code block, " + lines + " line" + (lines === 1 ? "" : "s") + ".",
        el: el, kind: "code",
        codeText: codeEl.textContent
      });
    } else if (tag === "table") {
      var rows = el.querySelectorAll("tr").length;
      var firstRow = el.querySelector("tr");
      var cols = firstRow ? firstRow.children.length : 0;
      transcript.push({
        text: "Table, " + rows + " row" + (rows === 1 ? "" : "s") + ", " +
              cols + " column" + (cols === 1 ? "" : "s") + ".",
        el: el, kind: "table"
      });
    }
  });

  // =================================================================
  // TTS engine (Web Speech API)
  // =================================================================
  var synth = window.speechSynthesis;
  var ttsSupported = !!synth;
  var idx = 0;
  var state = "stopped"; // stopped | playing | paused
  var readCode = false;
  var rate = 1;
  var chosenVoice = null;

  var live = document.getElementById("live");
  function announce(msg) { live.textContent = msg; }

  var btnPlay = document.getElementById("btn-play");
  var btnPause = document.getElementById("btn-pause");
  var btnStop = document.getElementById("btn-stop");
  var btnReadCode = document.getElementById("btn-readcode");
  var rateSel = document.getElementById("rate");
  var voiceSel = document.getElementById("voice");
  var scrubber = document.getElementById("scrubber");
  var scrubberLabel = document.getElementById("scrubber-label");

  scrubber.max = String(Math.max(0, transcript.length - 1));
  function updateScrubber() {
    scrubber.value = String(idx);
    scrubberLabel.textContent = (transcript.length ? (idx + 1) : 0) + " / " + transcript.length;
  }
  updateScrubber();

  function clearHighlight() {
    var prev = main.querySelector(".tts-active");
    if (prev) prev.classList.remove("tts-active");
  }
  function highlight(unit) {
    clearHighlight();
    if (unit && unit.el) {
      unit.el.classList.add("tts-active");
      unit.el.scrollIntoView({ behavior: "smooth", block: "center" });
    }
  }

  function spokenTextFor(unit) {
    if (unit.kind === "code" && readCode && unit.codeText) {
      return unit.text + " " + unit.codeText;
    }
    return unit.text;
  }

  function setButtons() {
    var playing = state === "playing";
    var paused = state === "paused";
    btnPlay.disabled = playing;
    btnPause.disabled = !(playing || paused);
    btnStop.disabled = state === "stopped";
    btnPause.textContent = paused ? "▶ Resume" : "⏸";
    btnPlay.setAttribute("aria-label", playing ? "Playing" : "Play read-aloud");
  }

  function speakCurrent() {
    if (!ttsSupported || idx >= transcript.length) { stop(); return; }
    var unit = transcript[idx];
    highlight(unit);
    updateScrubber();
    if (unit.kind === "heading") announce(unit.text);

    var u = new SpeechSynthesisUtterance(spokenTextFor(unit));
    u.rate = rate;
    if (chosenVoice) u.voice = chosenVoice;
    u.onend = function () {
      if (state !== "playing") return;
      idx++;
      if (idx < transcript.length) speakCurrent();
      else { announce("Finished reading."); stop(); }
    };
    synth.speak(u);
  }

  function play() {
    if (!ttsSupported) { announce("Text-to-speech is not available in this browser."); return; }
    if (!transcript.length) return;
    if (state === "paused") { synth.resume(); state = "playing"; setButtons(); announce("Resumed."); return; }
    synth.cancel();
    state = "playing";
    setButtons();
    announce("Playing.");
    speakCurrent();
  }
  function pause() {
    if (state === "playing") { synth.pause(); state = "paused"; setButtons(); announce("Paused."); }
    else if (state === "paused") { play(); }
  }
  function stop() {
    if (ttsSupported) synth.cancel();
    state = "stopped";
    clearHighlight();
    setButtons();
    announce("Stopped.");
  }
  function playFromHeading(headingId) {
    for (var i = 0; i < transcript.length; i++) {
      if (transcript[i].kind === "heading" && transcript[i].headingId === headingId) { idx = i; break; }
    }
    if (state === "playing") synth.cancel();
    state = "stopped";
    play();
  }

  btnPlay.addEventListener("click", play);
  btnPause.addEventListener("click", pause);
  btnStop.addEventListener("click", stop);
  btnReadCode.addEventListener("click", function () {
    readCode = !readCode;
    btnReadCode.setAttribute("aria-pressed", String(readCode));
    btnReadCode.textContent = readCode ? "Read code" : "Skip code";
    announce(readCode ? "Code blocks will be read aloud." : "Code blocks will be skipped.");
  });
  rateSel.addEventListener("change", function () {
    rate = parseFloat(rateSel.value);
    if (state === "playing") { synth.cancel(); speakCurrent(); }
  });
  scrubber.addEventListener("input", function () {
    idx = parseInt(scrubber.value, 10) || 0;
    highlight(transcript[idx]);
    updateScrubber();
    if (state === "playing") { synth.cancel(); speakCurrent(); }
  });

  // voice picker
  function populateVoices() {
    if (!ttsSupported) { voiceSel.disabled = true; return; }
    var voices = synth.getVoices();
    voiceSel.innerHTML = "";
    voices.forEach(function (v, i) {
      var opt = document.createElement("option");
      opt.value = String(i);
      opt.textContent = v.name + (v.lang ? " (" + v.lang + ")" : "");
      if (v.default) opt.selected = true;
      voiceSel.appendChild(opt);
    });
    if (voices.length && !chosenVoice) {
      chosenVoice = voices.find(function (v) { return v.default; }) || voices[0];
    }
  }
  voiceSel.addEventListener("change", function () {
    var voices = synth.getVoices();
    chosenVoice = voices[parseInt(voiceSel.value, 10)] || null;
    if (state === "playing") { synth.cancel(); speakCurrent(); }
  });
  if (ttsSupported) {
    populateVoices();
    if (typeof synth.onvoiceschanged !== "undefined") synth.onvoiceschanged = populateVoices;
  } else {
    [btnPlay, btnPause, btnStop, rateSel, voiceSel].forEach(function (el) { el.disabled = true; });
    announce("Text-to-speech is not supported in this browser.");
  }

  // =================================================================
  // Theme toggle
  // =================================================================
  var themeToggle = document.getElementById("theme-toggle");
  function currentTheme() {
    var explicit = document.documentElement.getAttribute("data-theme");
    if (explicit) return explicit;
    return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  }
  function applyTheme(theme) {
    document.documentElement.setAttribute("data-theme", theme);
    themeToggle.setAttribute("aria-pressed", String(theme === "dark"));
    themeToggle.textContent = theme === "dark" ? "☀ Light" : "🌙 Dark";
  }
  themeToggle.addEventListener("click", function () {
    applyTheme(currentTheme() === "dark" ? "light" : "dark");
  });
  applyTheme(currentTheme());

  // =================================================================
  // P3 — command palette
  // =================================================================
  var overlay = document.getElementById("palette-overlay");
  var paletteInput = document.getElementById("palette-input");
  var paletteList = document.getElementById("palette-list");
  var paletteOpenBtn = document.getElementById("palette-open");
  var paletteSelected = 0;
  var lastFocused = null;

  function buildActions() {
    var actions = [
      { label: "Play read-aloud", kind: "playback", run: play },
      { label: "Pause / resume read-aloud", kind: "playback", run: pause },
      { label: "Stop read-aloud", kind: "playback", run: stop },
      { label: "Toggle theme (light / dark)", kind: "view", run: function () { themeToggle.click(); } },
      { label: "Toggle read code aloud", kind: "playback", run: function () { btnReadCode.click(); } },
      { label: "Faster (increase speed)", kind: "playback", run: function () { stepRate(1); } },
      { label: "Slower (decrease speed)", kind: "playback", run: function () { stepRate(-1); } }
    ];
    headings.forEach(function (h) {
      actions.push({
        label: "Jump to: " + h.textContent.trim(),
        kind: "section",
        run: function () { jumpToHeading(h.id, true); },
        runAlt: function () { playFromHeading(h.id); }
      });
    });
    return actions;
  }
  function stepRate(dir) {
    var i = rateSel.selectedIndex + dir;
    if (i < 0) i = 0;
    if (i >= rateSel.options.length) i = rateSel.options.length - 1;
    rateSel.selectedIndex = i;
    rateSel.dispatchEvent(new Event("change"));
    announce("Speed " + rateSel.value + " times.");
  }
  var allActions = buildActions();
  var filtered = allActions.slice();

  function fuzzyMatch(query, text) {
    query = query.toLowerCase().replace(/\s+/g, ""); text = text.toLowerCase();
    if (!query) return true;
    var qi = 0;
    for (var i = 0; i < text.length && qi < query.length; i++) {
      if (text[i] === query[qi]) qi++;
    }
    return qi === query.length;
  }
  function renderPalette() {
    paletteList.innerHTML = "";
    filtered.forEach(function (a, i) {
      var li = document.createElement("li");
      li.id = "pl-opt-" + i;
      li.setAttribute("role", "option");
      li.setAttribute("aria-selected", String(i === paletteSelected));
      var label = document.createElement("span");
      label.textContent = a.label;
      var kind = document.createElement("span");
      kind.className = "pl-kind";
      kind.textContent = a.kind;
      li.appendChild(label); li.appendChild(kind);
      li.addEventListener("click", function () { runAction(i); });
      paletteList.appendChild(li);
    });
    var active = filtered.length ? "pl-opt-" + paletteSelected : "";
    paletteInput.setAttribute("aria-activedescendant", active);
  }
  function filterPalette() {
    var q = paletteInput.value.trim();
    filtered = allActions.filter(function (a) { return fuzzyMatch(q, a.label); });
    paletteSelected = 0;
    renderPalette();
  }
  function runAction(i, alt) {
    var a = filtered[i];
    if (!a) return;
    closePalette();
    if (alt && a.runAlt) a.runAlt(); else a.run();
  }
  function openPalette() {
    lastFocused = document.activeElement;
    overlay.hidden = false;
    paletteInput.value = "";
    filterPalette();
    paletteInput.focus();
  }
  function closePalette() {
    overlay.hidden = true;
    if (lastFocused && lastFocused.focus) lastFocused.focus();
  }
  paletteOpenBtn.addEventListener("click", openPalette);
  paletteInput.addEventListener("input", filterPalette);
  overlay.addEventListener("mousedown", function (e) { if (e.target === overlay) closePalette(); });

  paletteInput.addEventListener("keydown", function (e) {
    if (e.key === "ArrowDown") { e.preventDefault(); paletteSelected = Math.min(filtered.length - 1, paletteSelected + 1); renderPalette(); ensureVisible(); }
    else if (e.key === "ArrowUp") { e.preventDefault(); paletteSelected = Math.max(0, paletteSelected - 1); renderPalette(); ensureVisible(); }
    else if (e.key === "Enter") { e.preventDefault(); runAction(paletteSelected, e.shiftKey); }
    else if (e.key === "Escape") { e.preventDefault(); closePalette(); }
    else if (e.key === "Tab") { e.preventDefault(); } // focus trap: keep focus on input
  });
  function ensureVisible() {
    var el = document.getElementById("pl-opt-" + paletteSelected);
    if (el) el.scrollIntoView({ block: "nearest" });
  }

  // =================================================================
  // Global keyboard shortcuts
  // =================================================================
  document.addEventListener("keydown", function (e) {
    var inField = /^(input|select|textarea)$/i.test((e.target.tagName || ""));
    if ((e.metaKey || e.ctrlKey) && (e.key === "k" || e.key === "K")) {
      e.preventDefault();
      if (overlay.hidden) openPalette(); else closePalette();
      return;
    }
    if (!overlay.hidden) return; // palette handles its own keys
    if (inField) return;
    if (e.key === " " || e.key === "k") { e.preventDefault(); (state === "playing") ? pause() : play(); }
    else if (e.key === "Escape") { stop(); }
  });

  // expose a tiny hook for automated a11y tests (non-enumerable-ish)
  window.__planReader = {
    headingCount: headings.length,
    tocCount: tocLinks.length,
    transcriptLength: transcript.length,
    ttsSupported: ttsSupported,
    codeUnits: transcript.filter(function (u) { return u.kind === "code"; }).length,
    firstCodeUtterance: (transcript.find(function (u) { return u.kind === "code"; }) || {}).text || null,
    openPalette: openPalette,
    closePalette: closePalette,
    isPaletteOpen: function () { return !overlay.hidden; }
  };
})();
</script>
</body>
</html>
